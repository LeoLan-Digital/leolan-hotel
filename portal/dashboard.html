<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hotel Dashboard — LeoLan Digital</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0e1621;color:#e8eaed;min-height:100vh}

    header{background:#17212b;border-bottom:1px solid #2a3a4a;padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
    .header-left{display:flex;align-items:center;gap:12px}
    .header-emoji{font-size:24px}
    .header-title{font-size:16px;font-weight:700;color:#e8eaed}
    .header-sub{font-size:12px;color:#8a9bb8}
    .btn-logout{background:transparent;border:1.5px solid #2a3a4a;color:#8a9bb8;border-radius:10px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s}
    .btn-logout:hover{border-color:#ef4444;color:#ef4444}
    .header-nav{display:flex;align-items:center;gap:8px}
    .btn-nav{background:transparent;border:1.5px solid #2a3a4a;color:#8a9bb8;border-radius:10px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;transition:all 0.2s;display:inline-flex;align-items:center;gap:6px}
    .btn-nav:hover{border-color:#34c759;color:#34c759}

    main{max-width:1100px;margin:0 auto;padding:24px 16px 48px}

    .loading{text-align:center;padding:80px 20px;color:#8a9bb8}
    .spinner{width:36px;height:36px;border:3px solid #2a3a4a;border-top-color:#34c759;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
    @keyframes spin{to{transform:rotate(360deg)}}

    .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}
    @media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
    .stat-card{background:#17212b;border-radius:16px;padding:20px 16px;text-align:center}
    .stat-icon{font-size:22px;margin-bottom:8px}
    .stat-val{font-size:28px;font-weight:800;color:#34c759;line-height:1}
    .stat-label{font-size:12px;color:#8a9bb8;margin-top:6px;font-weight:500}

    section{margin-bottom:24px}
    .section-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .section-title{font-size:16px;font-weight:700}
    .badge{background:rgba(52,199,89,0.15);color:#34c759;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}

    .card{background:#17212b;border-radius:16px;overflow:hidden}

    /* Rooms grid */
    .rooms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0}
    .room-item{padding:16px;border-bottom:1px solid #1e2d3d;border-right:1px solid #1e2d3d;text-align:center}
    .room-number{font-size:18px;font-weight:800;margin-bottom:6px}
    .room-type{font-size:12px;color:#8a9bb8;margin-bottom:8px}
    .room-status{display:inline-block;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px}
    .status-occupied{background:rgba(239,68,68,0.15);color:#ef4444}
    .status-free,.status-available{background:rgba(52,199,89,0.15);color:#34c759}
    .status-reserved{background:rgba(251,191,36,0.15);color:#fbbf24}
    .room-guest{font-size:12px;color:#8a9bb8;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* Messages */
    .msg-thread{padding:16px 20px;border-bottom:1px solid #1e2d3d}
    .msg-thread:last-child{border-bottom:none}
    .msg-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
    .msg-from{font-weight:700;font-size:14px}
    .msg-time{font-size:12px;color:#8a9bb8}
    .msg-preview{font-size:13px;color:#8a9bb8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .msg-unread .msg-from{color:#34c759}

    /* Account */
    .account-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
    .account-item{padding:16px 20px;border-bottom:1px solid #1e2d3d}
    .account-item:nth-child(odd){border-right:1px solid #1e2d3d}
    .account-item:nth-last-child(-n+2){border-bottom:none}
    .account-label{font-size:12px;color:#8a9bb8;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px}
    .account-val{font-size:15px;font-weight:700}
    .pill{display:inline-block;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:700}
    .pill-green{background:rgba(52,199,89,0.15);color:#34c759}
    .pill-yellow{background:rgba(251,191,36,0.15);color:#fbbf24}
    .pill-red{background:rgba(239,68,68,0.15);color:#ef4444}

    .credits-body{padding:20px}
    .credits-numbers{display:flex;justify-content:space-between;margin-bottom:10px;font-size:14px;color:#8a9bb8}
    .credits-numbers strong{color:#e8eaed}
    .progress-bar{background:#1e2d3d;border-radius:999px;height:12px;overflow:hidden}
    .progress-fill{background:linear-gradient(90deg,#34c759,#5de67a);border-radius:999px;height:100%;transition:width 0.5s ease}
    .credits-detail{margin-top:14px;font-size:13px;color:#8a9bb8;display:flex;gap:20px;flex-wrap:wrap}

    .empty{padding:40px 20px;text-align:center;color:#4a5a6a;font-size:14px}
    .empty-icon{font-size:32px;display:block;margin-bottom:10px}

    .toast{position:fixed;bottom:24px;right:24px;background:#17212b;border:1.5px solid #2a3a4a;border-radius:12px;padding:12px 18px;font-size:14px;font-weight:600;color:#e8eaed;box-shadow:0 4px 16px rgba(0,0,0,0.4);transform:translateY(80px);opacity:0;transition:all 0.3s;z-index:200;max-width:300px}
    .toast.show{transform:translateY(0);opacity:1}
    .toast.success{border-color:#34c759;color:#34c759}
    .toast.error{border-color:#ef4444;color:#ef4444}

    /* Occupancy gauge */
    .occupancy-gauge{padding:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .gauge-ring{position:relative;width:80px;height:80px;flex-shrink:0}
    .gauge-svg{width:80px;height:80px;transform:rotate(-90deg)}
    .gauge-bg{fill:none;stroke:#1e2d3d;stroke-width:8}
    .gauge-fill{fill:none;stroke:#34c759;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 0.6s ease}
    .gauge-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:16px;font-weight:800;color:#34c759}
    .gauge-info{flex:1}
    .gauge-title{font-size:14px;font-weight:700;margin-bottom:4px}
    .gauge-detail{font-size:13px;color:#8a9bb8}
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="header-emoji">🏨</span>
    <div>
      <div class="header-title">Hotel Dashboard</div>
      <div class="header-sub" id="header-code">LeoLan Digital</div>
    </div>
  </div>
  <div class="header-nav">
    <a href="pricing.html" class="btn-nav">💰 Pricing</a>
    <button class="btn-logout" onclick="logout()">Abmelden</button>
  </div>
</header>

<main>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>Daten werden geladen...</div>
  </div>

  <div id="content" style="display:none">
    <!-- Stats -->
    <div class="stats" id="stats-row"></div>

    <!-- Auslastung -->
    <section>
      <div class="section-header">
        <span class="section-title">Belegungsrate</span>
      </div>
      <div class="card" id="occupancy-card"></div>
    </section>

    <!-- Zimmer -->
    <section>
      <div class="section-header">
        <span class="section-title">Zimmer & Einheiten</span>
        <span class="badge" id="rooms-badge">0</span>
      </div>
      <div class="card" id="rooms-list"></div>
    </section>

    <!-- Nachrichten -->
    <section>
      <div class="section-header">
        <span class="section-title">Gäste-Nachrichten</span>
        <span class="badge" id="msg-badge">0</span>
      </div>
      <div class="card" id="msg-list"></div>
    </section>

    <!-- Konto -->
    <section>
      <div class="section-header">
        <span class="section-title">Konto</span>
      </div>
      <div class="card">
        <div class="account-grid" id="account-grid"></div>
      </div>
    </section>

    <!-- Credits -->
    <section>
      <div class="section-header">
        <span class="section-title">Nachrichten-Credits</span>
      </div>
      <div class="card">
        <div class="credits-body" id="credits-body"></div>
      </div>
    </section>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  const DASHBOARD_URL = 'https://n8n.leolan.net/webhook/hotel-dashboard';
  const ADMIN_KEY = 'LeoLan2026Admin!';

  const token = sessionStorage.getItem('token');
  const customerCode = sessionStorage.getItem('customerCode');

  if (!token || !customerCode) {
    window.location.href = 'index.html';
  }

  document.getElementById('header-code').textContent = customerCode || 'LeoLan Digital';

  function logout() {
    sessionStorage.clear();
    window.location.href = 'index.html';
  }

  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    setTimeout(() => { t.className = 'toast'; }, 3000);
  }

  function statusPill(s) {
    if (!s) return '—';
    const map = { active:'pill-green', aktiv:'pill-green', inactive:'pill-yellow', paused:'pill-yellow', error:'pill-red', fehler:'pill-red' };
    const cls = map[s.toLowerCase()] || 'pill-yellow';
    return '<span class="pill ' + cls + '">' + s + '</span>';
  }

  function roomStatusBadge(s) {
    if (!s) return '';
    const map = { occupied:'status-occupied', belegt:'status-occupied', free:'status-free', frei:'status-free', available:'status-available', reserved:'status-reserved', reserviert:'status-reserved' };
    const cls = map[(s||'').toLowerCase()] || 'status-free';
    const labels = { occupied:'Belegt', belegt:'Belegt', free:'Frei', frei:'Frei', available:'Frei', reserved:'Reserviert', reserviert:'Reserviert' };
    return '<span class="room-status ' + cls + '">' + (labels[(s||'').toLowerCase()] || s) + '</span>';
  }

  function fmtDate(d) {
    if (!d) return '';
    try { return new Date(d).toLocaleDateString('de-DE', {day:'2-digit',month:'2-digit',year:'numeric'}); } catch(e){return d;}
  }

  async function callAction(action, extra) {
    const res = await fetch(DASHBOARD_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ adminKey: ADMIN_KEY, action, customerCode, token }, extra || {}))
    });
    return res.json().catch(function(){ return {}; });
  }

  function renderStats(data) {
    const cap = data.capacity || [];
    const occupied = cap.filter(function(r){ return r.status && r.status.toLowerCase() === 'occupied' || r.status === 'belegt'; }).length;
    const total = cap.length || 1;
    const free = total - occupied;
    const pct = Math.round((occupied / total) * 100);

    const newGuests = data.newGuests ?? data.newArrivals ?? '—';
    const stats = [
      { icon:'🛏️', val: occupied, label:'Belegte Zimmer' },
      { icon:'✅', val: free, label:'Verfügbare Zimmer' },
      { icon:'👤', val: newGuests, label:'Neue Gäste' },
      { icon:'📊', val: (cap.length ? pct + '%' : '—'), label:'Auslastung' },
    ];
    document.getElementById('stats-row').innerHTML = stats.map(function(s){
      return '<div class="stat-card"><div class="stat-icon">' + s.icon + '</div><div class="stat-val">' + s.val + '</div><div class="stat-label">' + s.label + '</div></div>';
    }).join('');
  }

  function renderOccupancy(data) {
    const cap = data.capacity || [];
    const total = cap.length || 1;
    const occupied = cap.filter(function(r){ return (r.status||'').toLowerCase() === 'occupied' || (r.status||'').toLowerCase() === 'belegt'; }).length;
    const pct = Math.round((occupied / total) * 100);
    const circumference = 2 * Math.PI * 32;
    const offset = circumference * (1 - pct/100);
    const color = pct < 60 ? '#34c759' : pct < 85 ? '#fbbf24' : '#ef4444';
    document.getElementById('occupancy-card').innerHTML =
      '<div class="occupancy-gauge">' +
        '<div class="gauge-ring">' +
          '<svg class="gauge-svg" viewBox="0 0 80 80">' +
            '<circle class="gauge-bg" cx="40" cy="40" r="32"/>' +
            '<circle class="gauge-fill" cx="40" cy="40" r="32" stroke="' + color + '" stroke-dasharray="' + circumference + '" stroke-dashoffset="' + offset + '"/>' +
          '</svg>' +
          '<div class="gauge-text" style="color:' + color + '">' + pct + '%</div>' +
        '</div>' +
        '<div class="gauge-info">' +
          '<div class="gauge-title">Aktuelle Belegung</div>' +
          '<div class="gauge-detail">' + occupied + ' von ' + total + ' Zimmern belegt</div>' +
          '<div class="gauge-detail" style="margin-top:4px">' + (total - occupied) + ' Zimmer verfügbar</div>' +
        '</div>' +
      '</div>';
  }

  function renderRooms(capacity) {
    var list = document.getElementById('rooms-list');
    if (!capacity || capacity.length === 0) {
      list.innerHTML = '<div class="empty"><span class="empty-icon">🛏️</span>Keine Zimmer vorhanden</div>';
      document.getElementById('rooms-badge').textContent = '0';
      return;
    }
    document.getElementById('rooms-badge').textContent = capacity.length;
    list.innerHTML = '<div class="rooms-grid">' + capacity.map(function(r){
      var guest = '';
      if (r.guest || r.guestName) {
        guest = '<div class="room-guest">' + (r.guest || r.guestName) + '</div>';
      }
      return '<div class="room-item">' +
        '<div class="room-number">' + (r.room || r.number || r.id || '?') + '</div>' +
        '<div class="room-type">' + (r.type || r.roomType || 'Standard') + '</div>' +
        roomStatusBadge(r.status) +
        guest +
      '</div>';
    }).join('') + '</div>';
  }

  function renderMessages(messages) {
    var list = document.getElementById('msg-list');
    if (!messages || messages.length === 0) {
      list.innerHTML = '<div class="empty"><span class="empty-icon">💬</span>Noch keine Nachrichten vorhanden</div>';
      document.getElementById('msg-badge').textContent = '0';
      return;
    }
    document.getElementById('msg-badge').textContent = messages.length;
    list.innerHTML = messages.map(function(m){
      var unread = m.unread ? 'msg-unread' : '';
      return '<div class="msg-thread ' + unread + '">' +
        '<div class="msg-header">' +
          '<span class="msg-from">' + (m.from || m.guestName || m.name || 'Unbekannt') + '</span>' +
          '<span class="msg-time">' + (m.time || m.timestamp ? fmtDate(m.time || m.timestamp) : '') + '</span>' +
        '</div>' +
        '<div class="msg-preview">' + (m.lastMessage || m.preview || m.text || '—') + '</div>' +
      '</div>';
    }).join('');
  }

  function renderAccount(data) {
    var account = data.account || data;
    var items = [
      { label: 'Paket', val: account.package || account.plan || '—' },
      { label: 'Status', val: statusPill(account.status || account.accountStatus || '') },
      { label: 'Bot-Status', val: statusPill(account.botStatus || account.bot_status || '') },
      { label: 'Mitglied seit', val: fmtDate(account.createdAt || account.memberSince) || '—' },
    ];
    document.getElementById('account-grid').innerHTML = items.map(function(i){
      return '<div class="account-item"><div class="account-label">' + i.label + '</div><div class="account-val">' + (i.val || '—') + '</div></div>';
    }).join('');
  }

  function renderCredits(data) {
    var used = data.creditsUsed != null ? data.creditsUsed : (data.messagesUsed != null ? data.messagesUsed : 0);
    var remaining = data.creditsRemaining != null ? data.creditsRemaining : (data.messageCredits != null ? data.messageCredits : 0);
    var total = (used + remaining) || 1;
    var pct = Math.min(100, Math.round((remaining / total) * 100));
    var color = pct > 40 ? '#34c759' : pct > 15 ? '#fbbf24' : '#ef4444';
    document.getElementById('credits-body').innerHTML =
      '<div class="credits-numbers">' +
        '<span><strong>' + remaining + '</strong> verbleibend</span>' +
        '<span><strong>' + used + '</strong> verbraucht</span>' +
      '</div>' +
      '<div class="progress-bar">' +
        '<div class="progress-fill" style="width:' + pct + '%;background:' + color + '"></div>' +
      '</div>' +
      '<div class="credits-detail">' +
        '<span>Gesamt: <strong>' + total + '</strong></span>' +
        '<span>Auslastung: <strong>' + (100 - pct) + '%</strong></span>' +
      '</div>';
  }

  async function loadDashboard() {
    try {
      var data = await callAction('get-dashboard');

      if (data.error === 'unauthorized' || data.error === 'invalid_token') {
        sessionStorage.clear();
        window.location.href = 'index.html';
        return;
      }

      renderStats(data);
      renderOccupancy(data);
      renderRooms(data.capacity || []);
      renderMessages(data.messages || []);
      renderAccount(data);
      renderCredits(data);

      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = '';
    } catch(e) {
      document.getElementById('loading').innerHTML =
        '<div style="color:#ef4444">Fehler beim Laden der Daten.<br><small>' + e.message + '</small></div>' +
        '<br><button onclick="loadDashboard()" style="margin-top:12px;padding:10px 20px;border-radius:10px;background:#34c759;color:#fff;border:none;cursor:pointer;font-weight:700">Erneut versuchen</button>';
    }
  }

  loadDashboard();
</script>
</body>
</html>
